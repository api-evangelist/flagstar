actions:
  apisYmlUpdated: true
  reason: |
    A first-party developer portal exists and was confirmed live, but it
    publishes no public API products, documentation, or downloadable OpenAPI to
    anonymous visitors. No API entries were fabricated; apis[] is left empty and
    the confirmed developer portal is recorded in common[] as DeveloperPortal.
    No FDX/1033 posture and no first-party public data-access API; aggregator
    access noted honestly.
